meta:
  name: "RS4_refresh"
  system: ${systemname}
  connection: ${systemname}
  client: ${clientid}
  user: ${User_name}
  password: ${password}
  mode: auto
  tags: [STMS]
variables:
  folder_path: "C:\\Replay_Studio_Engine\\ReplayStudio_Files\\YAML\\Screenshot"
steps:
# STMS
  - transaction: "/nSTMS"
    comment: "Open transaction STMS"
  - screenshot:
      path: "${folder_path}\\${systemname}\\STMS_one_001.jpg"
  - press:
      id: "/app/con[0]/ses[0]/wnd[0]/tbar[1]/btn[5]"
      label: "Import Overview"
    comment: "Press Import Overview"
  - screenshot:
      path: "${folder_path}\\${systemname}\\STMS_002.jpg"
  - press:
      id: "/app/con[0]/ses[0]/wnd[0]/tbar[0]/btn[3]"
      label: "Back"
    comment: "Press Back"
  - press:
      id: "/app/con[0]/ses[0]/wnd[0]/tbar[1]/btn[19]"
      label: "Transport Routes"
    comment: "Press Transport Routes"
  - screenshot:
      path: "${folder_path}\\${systemname}\\STMS_003.jpg"
#SCC4
  - transaction: "/nSCC4"
    comment: "Open transaction SCC4"
  - screenshot:
      path: "${folder_path}\\${systemname}\\SCC4_004.jpg"
#Al11
  - transaction: "/nAL11"
    comment: "Open transaction AL11"
  - screenshot:
      path: "${folder_path}\\${systemname}\\AL11_005.jpg"
#SHMM
  - transaction: "/nSHMM"
    comment: "Open transaction SHMM"
  - screenshot:
      path: "${folder_path}\\${systemname}\\SHMM_006.jpg"
#RZ12
  - transaction: "/nRZ12"
    comment: "Open transaction RZ12"
  - screenshot:
      path: "${folder_path}\\${systemname}\\RZ12_007.jpg"
  - transaction: /nex
